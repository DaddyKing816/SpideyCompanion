name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'package/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Spidey Companion v1.3.0
        shell: pwsh
        run: |
          dotnet build src/SpideyCompanion.csproj -c Release -o build-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build-out/SpideyCompanion.exe)) { throw "build output missing" }
          Rename-Item build-out/SpideyCompanion.exe SpideyCompanion-v1.3.0.exe
          Rename-Item build-out/SpideyCompanion.exe.config SpideyCompanion-v1.3.0.exe.config

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" installer/SpideyCompanion.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SpideyCompanion-Setup-v1.3.0
          path: installer/Output/SpideyCompanion-Setup-v1.3.0.exe
          if-no-files-found: error

      - name: Attach the installer to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/SpideyCompanion-Setup-v1.3.0.exe
